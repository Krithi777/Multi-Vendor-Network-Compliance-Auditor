set deviceconfig system hostname vsys-zones
set network interface ethernet ethernet1/1 layer3 ip 192.0.2.1/24
set network interface ethernet ethernet1/2 layer3 ip 192.0.2.2/24
set network interface ethernet ethernet1/3 layer3 units ethernet1/3.1 ip 192.0.2.3/24
set vsys vsys1 zone z1 network layer3 [ ethernet1/1 ethernet1/2 ethernet1/3.1 ]
set vsys vsys11 zone z1 network layer3
