set deviceconfig system hostname address-objects

set address addr0

set address addr1 ip-netmask 192.0.2.1/24
set address addr1 description addr1-desc
set address addr1 tag tag1

set address addr2 ip-netmask 192.0.2.2
set address addr2 tag [ tag2 "tag with spaces"]

set address addr3 ip-range 192.0.2.3-192.0.2.4

set address addrBadRange1 ip-range 192.0.2.4-192.0.2.3
set address addrBadRange2 ip-range 192.0.2.3-192.0.2.3

set address "addr w spaces"

set address addr4 ip-netmask 192.0.2.1/32
set address 192.0.2.5 ip-netmask 192.0.2.6/32
set network interface ethernet ethernet1/1 layer3 ip addr4
set network interface ethernet ethernet1/2 layer3 ip 192.0.2.7
set network interface ethernet ethernet1/3 layer3 ip 192.0.2.5
set network interface ethernet ethernet1/4 layer3 ip addr_undef
# Valid object name, but invalid subtype (ip-range)
set network interface ethernet ethernet1/5 layer3 ip addr3
set network interface loopback ip addr4
