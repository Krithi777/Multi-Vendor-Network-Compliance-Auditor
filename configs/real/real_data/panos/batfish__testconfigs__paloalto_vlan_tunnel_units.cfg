!RANCID-CONTENT-TYPE: paloalto
config {
  devices {
    localhost.localdomain {
      deviceconfig {
        system {
          hostname "paloalto_vlan_tunnel_units";
        }
      }
      network {
        interface {
          tunnel {
            units {
              tunnel.3 {
                comment "tunnel.3 comment";
                ip {
                  192.0.2.1/30;
                }
                mtu 1427;
              }
            }
          }
          vlan {
            comment "vlan comment";
            units {
              vlan.1 {
                comment "vlan.1 comment";
                ip {
                  192.0.2.2/24;
                }
                mtu 1500;
              }
            }
          }
        }
      }
    }
  }
}