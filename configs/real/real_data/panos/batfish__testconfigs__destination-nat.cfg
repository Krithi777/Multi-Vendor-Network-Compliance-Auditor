policy {
  panorama {
  }
}
config {
  devices {
    localhost.localdomain {
      network {
        interface {
          ethernet {
            ethernet1/1 {
              layer3 {
                units {
                  ethernet1/1.1 {
                    ip {
                      192.0.2.1/24;
                    }
                    tag 1;
                  }
                  ethernet1/1.2 {
                    ip {
                      192.0.2.2/24;
                    }
                    tag 2;
                  }
                }
              }
            }
            ethernet1/2 {
              layer3 {
                units {
                  ethernet1/2.1 {
                    ip {
                      192.0.2.3/24;
                    }
                  }
                }
              }
            }
          }
        }
        virtual-router {
          vr1 {
            interface [ ethernet1/1.1 ethernet1/1.2 ethernet1/2.1];
          }
        }
      }
      deviceconfig {
        system {
          hostname destination-nat;
        }
      }
      vsys {
        vsys1 {
          address {
            SOURCE_ADDR1 {
              ip-netmask 192.0.2.4/32;
            }
            SOURCE_ADDR2 {
              ip-netmask 192.0.2.5/32;
            }
            SERVER_NEW_ADDR {
              ip-netmask 192.0.2.6/32;
            }
            BOGUS_ADDR {
              ip-netmask 192.0.2.7/32;
            }
          }
          rulebase {
            nat {
              rules {
                DEST_NAT_NAME1 {
                  destination-translation {
                    translated-address SERVER_NEW_ADDR;
                  }
                  to INSIDE;
                  from OUTSIDE;
                  source SOURCE_ADDR1;
                  destination any;
                }
                # Should never apply this NAT since previous rule will always be applied first
                DEST_NAT_NEVER_REACHED {
                  destination-translation {
                    translated-address BOGUS_ADDR;
                  }
                  to INSIDE;
                  from OUTSIDE;
                  source SOURCE_ADDR1;
                  destination any;
                }
                DEST_NAT_NAME2 {
                  destination-translation {
                    translated-address SERVER_NEW_ADDR;
                    translated-port 1234;
                  }
                  to INSIDE;
                  from OUTSIDE;
                  source SOURCE_ADDR2;
                  destination any;
                }
              }
            }
            security {
              rules {
                PERMIT_ALL {
                  to any;
                  from any;
                  source any;
                  destination any;
                  application any;
                  service any;
                  action allow;
                }
              }
            }
          }
          zone {
            INSIDE {
              network {
                layer3 [ ethernet1/1.1 ethernet1/1.2];
              }
            }
            OUTSIDE {
              network {
                layer3 [ ethernet1/2.1];
              }
            }
          }
        }
      }
    }
  }
}
