# RANCID-CONTENT-TYPE: juniper
set system host-name generated-routes
#
set policy-options policy-statement MOST_SPECIFIC term t1 from route-filter 192.0.2.1/32 exact
set policy-options policy-statement MOST_SPECIFIC term t1 then accept
set policy-options policy-statement MOST_SPECIFIC term t2 then reject
set routing-options generate route 192.0.2.2/8 active
set routing-options generate route 192.0.2.1/8 active
set routing-options generate route 192.0.2.1/8 policy MOST_SPECIFIC
set routing-options generate route 192.0.2.3/8 passive
set routing-options generate route 192.0.2.4 passive
set routing-options generate route 192.0.2.4 tag 3
#
