#
set system host-name static-routes
#
set routing-options static route 192.0.2.1/8 next-hop 192.0.2.2
set routing-options static route 192.0.2.1/8 install
set routing-options static route 192.0.2.1/8 readvertise
set routing-instances ri2 routing-options static route 192.0.2.3/8 next-hop 192.0.2.4
set routing-options static route 192.0.2.5/8 no-install
# Mix of next hop IP and interface are installed as multiple next hops
set routing-options static route 192.0.2.6/8 next-hop 192.0.2.2
set routing-options static route 192.0.2.6/8 next-hop ge-0/0/0.0
set routing-options static route 192.0.2.6/8 next-hop 192.0.2.4
set routing-options static route 192.0.2.7/8 next-hop 192.0.2.2
set routing-options static route 192.0.2.7/8 resolve
set routing-options static route 192.0.2.8/8 next-table ri2.inet.0
# Static route with only qualified-next-hops is valid
set routing-options static route 192.0.2.9/16 qualified-next-hop 192.0.2.10
set routing-options static route 192.0.2.9/16 qualified-next-hop 192.0.2.11
# note: /32 is implicit
set routing-options static route 192.0.2.12 next-hop 192.0.2.13
#
set routing-options static route 192.0.2.14/8 next-hop 192.0.2.10
set routing-options static route 192.0.2.14/8 no-readvertise
set routing-options static route 192.0.2.14/8 no-retain
set routing-options static route 192.0.2.14/8 passive
set routing-options static route 192.0.2.14/8 tag 12
set routing-options static route 192.0.2.14/8 tag2 1212
#
set routing-options static route 192.0.2.15/8 next-hop 192.0.2.10
set routing-options static route 192.0.2.15/8 active
set routing-options static route 192.0.2.15/8 as-path path "3333 111 1222"
set routing-options static route 192.0.2.15/8 retain
#
set routing-instances ri3 routing-options static route 192.0.2.16/24 preference 150
set routing-instances ri3 routing-options static route 192.0.2.16/24 next-hop 192.0.2.17
set routing-instances ri3 routing-options static route 192.0.2.16/24 metric 6
set routing-instances ri3 routing-options static route 192.0.2.16/24 qualified-next-hop ge-0/0/0.0
set routing-instances ri3 routing-options static route 192.0.2.16/24 qualified-next-hop 192.0.2.10 preference 180
set routing-instances ri3 routing-options static route 192.0.2.16/24 qualified-next-hop 192.0.2.10 tag 4294967295
set routing-instances ri3 routing-options static route 192.0.2.16/24 qualified-next-hop 192.0.2.10 metric 7
set routing-instances ri3 routing-options static route 192.0.2.18/8 next-table inet.0
# next-hop 0.0.0.0 should be treated as discard
set routing-options static route 192.0.2.19/8 next-hop 0.0.0.0
#
set interfaces ge-0/0/0 unit 0 family inet address 192.0.2.20/24
