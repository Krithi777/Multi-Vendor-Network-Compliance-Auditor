#
set system host-name juniper-syslog
#
set system syslog host 192.0.2.1 any notice
set system syslog host 192.0.2.1 interactive-commands any
set system syslog host 192.0.2.1 facility-override local7
set system syslog host 192.0.2.1 source-address 192.0.2.2
set system syslog host 192.0.2.1 routing-instance RI
set system syslog host 192.0.2.1 explicit-priority
#
# Full host: facility+severity, port, transport, routing-instance
set system syslog host 192.0.2.3 any notice
set system syslog host 192.0.2.3 port 6514
set system syslog host 192.0.2.3 transport tcp
set system syslog host 192.0.2.3 routing-instance mgmt
#
# Multiple facility/severity pairs on one host
set system syslog host 192.0.2.4 kernel error
set system syslog host 192.0.2.4 daemon warning
#
# Every facility paired with a severity so all facility and severity
# grammar branches are exercised (severities cycle to cover all values).
set system syslog host 192.0.2.5 any any
set system syslog host 192.0.2.5 authorization none
set system syslog host 192.0.2.5 change-log emergency
set system syslog host 192.0.2.5 conflict-log alert
set system syslog host 192.0.2.5 daemon critical
set system syslog host 192.0.2.5 dfc error
set system syslog host 192.0.2.5 external warning
set system syslog host 192.0.2.5 firewall notice
set system syslog host 192.0.2.5 ftp info
set system syslog host 192.0.2.5 interactive-commands any
set system syslog host 192.0.2.5 kernel none
set system syslog host 192.0.2.5 ntp emergency
set system syslog host 192.0.2.5 pfe alert
set system syslog host 192.0.2.5 user critical
#
# Transport tls (tcp covered above; udp below) so all transport branches hit
set system syslog host 192.0.2.2 any info
set system syslog host 192.0.2.2 transport tls
#
set system syslog host 192.0.2.6 any info
set system syslog host 192.0.2.6 transport udp
#
