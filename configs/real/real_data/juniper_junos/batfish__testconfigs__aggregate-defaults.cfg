# RANCID-CONTENT-TYPE: juniper
set system host-name aggregate-defaults
#
set routing-options aggregate defaults passive
set routing-options aggregate route 192.0.2.1/8
set routing-options aggregate route 192.0.2.2/8 active
set routing-options aggregate route 192.0.2.3/8 passive
set routing-instances ri1 instance-type virtual-router
