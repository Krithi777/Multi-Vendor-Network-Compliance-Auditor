#RANCID-CONTENT-TYPE: juniper
system {
    host-name nested-config-with-secret-data;
}
routing-instances {
    VRF_NAME {
        routing-options {
            autonomous-system 1;
        }
        protocols {
            bgp {
                group VRF_GROUP {
                    type external;
                    authentication-key "abacadd"; ## SECRET-DATA
                    peer-as 60951;
                    neighbor 192.0.2.1 {
                        description description;
                    }
                }
            }
        }
    }
}