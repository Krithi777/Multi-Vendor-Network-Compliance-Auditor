#
set system host-name ae2
#
set interfaces ge-0/0/0 ether-options 802.3ad ae2
#
set interfaces ae2 vlan-tagging
set interfaces ae2 unit 0 vlan-id 100
set interfaces ae2 unit 0 family inet address 192.0.2.1/31
set interfaces ae2 unit 1 vlan-id 101
set interfaces ae2 unit 1 family inet address 192.0.2.2/31