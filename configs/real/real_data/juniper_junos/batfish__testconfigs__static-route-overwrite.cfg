#
set system host-name static-route-overwrite
#
set routing-instances ri2 routing-options static route 192.0.2.1/8 next-hop 192.0.2.2
#
# These static routes should all be overwritten
set routing-options static route 192.0.2.1/16 discard
set routing-options static route 192.0.2.3/16 next-table ri2.inet.0
set routing-options static route 192.0.2.4/16 next-hop 192.0.2.2
set routing-options static route 192.0.2.4/16 next-hop ge-0/0/0.0
set routing-options static route 192.0.2.5/16 next-table ri2.inet.0
#
# These are the only static routes that should persist
set routing-options static route 192.0.2.1/16 next-hop 192.0.2.2
set routing-options static route 192.0.2.3/16 next-hop ge-0/0/0.0
set routing-options static route 192.0.2.4/16 next-table ri2.inet.0
set routing-options static route 192.0.2.5/16 discard
#
#
set interfaces ge-0/0/0 unit 0 family inet address 192.0.2.6/24
