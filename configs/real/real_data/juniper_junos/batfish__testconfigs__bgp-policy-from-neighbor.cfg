#
set system host-name bgp-policy-from-neighbor
#
# policy -- thing we're testing
set policy-options policy-statement POL term t1 from neighbor 192.0.2.1
set policy-options policy-statement POL term t1 then accept
set policy-options policy-statement POL term t2 then reject
# Boilerplate + BGP setup with 2 neighbors
set interfaces xe-0/0/0 unit 0 family inet address 192.0.2.2/24
set routing-options autonomous-system 65500
set routing-options router-id 192.0.2.2
set protocols bgp group g1 type external
set protocols bgp group g1 peer-as 65501
set protocols bgp group g1 neighbor 192.0.2.1
set protocols bgp group g1 neighbor 192.0.2.3
set protocols bgp group g1 import POL
set protocols bgp group g1 local-address 192.0.2.4
