#
set system host-name static-routes-warn
#
set routing-instances ri2 routing-options static route 192.0.2.1/16 next-hop 192.0.2.2
# Valid
set routing-options static route 192.0.2.3/24 no-install
set routing-options static route 192.0.2.3/24 qualified-next-hop 192.0.2.4
# Invalid - cannot have discard and qualified-next-hop
set routing-options static route 192.0.2.5/24 discard
set routing-options static route 192.0.2.5/24 qualified-next-hop 192.0.2.2
# Invalid - cannot have next-table and qualified-next-hop
set routing-options static route 192.0.2.6/24 next-table ri2.inet.0
set routing-options static route 192.0.2.6/24 qualified-next-hop 192.0.2.7
#
set interfaces ge-0/0/0 unit 0 family inet address 192.0.2.8/24
