#
set system host-name ospf-area-interface-neighbor
#
set interfaces ge-0/0/0 unit 0 family inet address 192.0.2.1/31
set interfaces ge-0/0/1 unit 0 family inet address 192.0.2.2/31
#
set protocols ospf area 0 interface ge-0/0/0.0 interface-type nbma
set protocols ospf area 0 interface ge-0/0/0.0 neighbor 192.0.2.3
set protocols ospf area 0 interface ge-0/0/1.0 neighbor 192.0.2.4 eligible
#
