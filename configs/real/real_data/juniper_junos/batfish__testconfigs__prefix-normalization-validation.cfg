#
set system host-name prefix-normalization-validation
#
# Valid prefixes (no warnings expected)
set routing-options aggregate route 192.0.2.1/8 discard
set routing-options generate route 192.0.2.2/12 discard
set protocols ospf area 0 area-range 192.0.2.3/16
set firewall filter F1 term T1 from address 192.0.2.1/8
set firewall filter F1 term T1 then next-ip 192.0.2.1/24
set policy-options condition C1 if-route-exists 192.0.2.1/8
#
# Invalid prefixes (host bits set — fatal red flag expected)
set routing-options aggregate route 192.0.2.4/8 discard
set routing-options generate route 192.0.2.5/12 discard
set protocols ospf area 0 area-range 192.0.2.6/16
set firewall filter F2 term T2 from address 192.0.2.7/8
set firewall filter F2 term T2 then next-ip 192.0.2.8/24
set policy-options condition C2 if-route-exists 192.0.2.9/8
