#
set system host-name juniper-ospf-stub-settings
#
set interfaces ge-0/0/0 unit 0 family inet address 192.0.2.1/24
set interfaces ge-0/0/1 unit 0 family inet address 192.0.2.2/24
set interfaces ge-0/0/2 unit 0 family inet address 192.0.2.3/24
set interfaces ge-0/0/3 unit 0 family inet address 192.0.2.4/24
set interfaces ge-0/0/4 unit 0 family inet address 192.0.2.5/24
set interfaces ge-0/0/5 unit 0 family inet address 192.0.2.6/24
#
set protocols ospf area 0.0.0.0 interface ge-0/0/0.0
set protocols ospf area 0.0.0.1 nssa default-lsa
set protocols ospf area 192.0.2.7 interface ge-0/0/2.0
set protocols ospf area 192.0.2.7 nssa no-summaries
set protocols ospf area 0.0.0.3 interface ge-0/0/3.0
set protocols ospf area 0.0.0.3 stub
set protocols ospf area 192.0.2.8 interface ge-0/0/4.0
set protocols ospf area 192.0.2.8 stub no-summaries
set protocols ospf area 192.0.2.9 interface ge-0/0/5.0
set protocols ospf area 192.0.2.10 stub default-metric 10 no-summaries
#
