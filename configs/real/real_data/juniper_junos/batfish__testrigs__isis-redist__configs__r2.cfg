system {
    host-name r2;
}
interfaces {
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 192.0.2.1/30;   
            }
            family iso;
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.0.2.2/32;
            }
            family iso {
                address 49.0002.0172.0016.0907.00;
            }
        }
    }
}
routing-options {
    static {
        route 192.0.2.3/30 discard;
        route 192.0.2.4/30 discard;
    }
}                                       
protocols {
    isis {
        export export-static;
        interface ge-0/0/1.0;
        interface lo0.0;
    }
}
policy-options {
    policy-statement export-static {
        from protocol static;
        from route-filter 192.0.2.5/8 longer;
        then accept;
    }
}
