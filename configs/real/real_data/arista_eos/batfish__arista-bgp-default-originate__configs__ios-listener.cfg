!
hostname ios-listener
!
interface Loopback0
 ip address 192.0.2.1 255.255.255.255
!
interface FastEthernet0/0
  vrf VRF1
  ip address 192.0.2.2 255.255.255.0
!
interface FastEthernet0/1
  vrf VRF2
  ip address 192.0.2.3 255.255.255.0
!
interface FastEthernet0/2
  vrf VRF3
  ip address 192.0.2.4 255.255.255.0
!
interface FastEthernet0/3
  vrf VRF4
  ip address 192.0.2.5 255.255.255.0
!
router bgp 2
  bgp router-id 192.0.2.1
  address-family ipv4 vrf VRF1
    neighbor 192.0.2.6 remote-as 1
  exit-address-family
  address-family ipv4 vrf VRF2
    neighbor 192.0.2.7 remote-as 1
  exit-address-family
  address-family ipv4 vrf VRF3
    neighbor 192.0.2.8 remote-as 1
  exit-address-family
  address-family ipv4 vrf VRF4
    neighbor 192.0.2.9 remote-as 1
  exit-address-family
!
