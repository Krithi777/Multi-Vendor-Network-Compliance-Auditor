! Command: show running-config
! device: listener (vEOS, EOS-4.23.0.1F)
!
! boot system flash:/vEOS-lab.swi
!
hostname listener
!
interface Ethernet1
   no switchport
   ip address 192.0.2.1/24
!
interface Loopback0
   ip address 192.0.2.2/32
!
ip routing
!
router bgp 65000
   router-id 192.0.2.1
   neighbor 192.0.2.3 remote-as 65000
   neighbor 192.0.2.3 maximum-routes 12000
   neighbor 192.0.2.3 export-localpref 250
   network 192.0.2.2/32
!
