! boot system flash:EOS.swi
hostname r2
!
interface Ethernet1
 no switchport
 ip address 192.0.2.1/24
!
interface Loopback0
 ip address 192.0.2.2/32
!
router bgp 3
 router-id 192.0.2.2
 neighbor 192.0.2.3 remote-as 1
 ! below line causes r2 to report its local-as as 2 instead of 3 (from process-id) when establishing session with 192.0.2.3
 neighbor 192.0.2.3 local-as 2 no-prepend replace-as
!
