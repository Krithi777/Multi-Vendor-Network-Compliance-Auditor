! boot system flash:EOS.swi
hostname r1
!
interface Ethernet1
 no switchport
 ip address 192.0.2.1/24
!
interface Loopback0
 ip address 192.0.2.2/32
!
router bgp 1
 router-id 192.0.2.2
 ! local-as reported when establishing session with 192.0.2.3 is 1 because of process-id and lack of explicit local-as override as in r2
 neighbor 192.0.2.3 remote-as 2
!
