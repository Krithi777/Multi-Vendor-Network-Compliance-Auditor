! boot system flash:EOS.swi
hostname r2
!
interface Ethernet1
 no switchport
 ip address 192.0.2.1/24
!
interface Ethernet2
 no switchport
 ip address 192.0.2.2/24
!
interface Loopback0
 ip address 192.0.2.3/32
!
router bgp 2
 router-id 192.0.2.3
 !private as number below
 neighbor 192.0.2.4 remote-as 65530
 neighbor 192.0.2.5 remote-as 3
 neighbor 192.0.2.5 remove-private-as
!
