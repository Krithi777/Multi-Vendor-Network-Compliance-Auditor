boot system flash this-is-an-arista-device.swi
!
hostname arista-originator
!
interface Loopback0
 ip address 192.0.2.1/32
!
interface Eth0
 no switchport
 ip address 192.0.2.2/24
!
interface Eth1
 no switchport
 ip address 192.0.2.3/24
!
interface Eth2
 no switchport
 ip address 192.0.2.4/24
!
interface Eth3
 no switchport
 ip address 192.0.2.5/24
!
router bgp 1
 router-id 192.0.2.1
 !
 neighbor 192.0.2.6 remote-as 2
 neighbor 192.0.2.6 route-map DENY_ALL out
 neighbor 192.0.2.6 default-originate route-map SET_RM
 neighbor 192.0.2.6 send-community
 !
 neighbor 192.0.2.7 remote-as 2
 neighbor 192.0.2.7 route-map DENY_ALL out
 neighbor 192.0.2.7 default-originate route-map SET_RM
 !
 neighbor 192.0.2.8 remote-as 2
 neighbor 192.0.2.8 route-map DENY_ALL out
 neighbor 192.0.2.8 default-originate route-map UNDEFINED
 !
 neighbor 192.0.2.9 remote-as 2
 neighbor 192.0.2.9 route-map DENY_ALL out
 neighbor 192.0.2.9 default-originate
!
route-map SET_RM permit 10
 set community 111:222 additive
 set community 333:444 additive
 set as-path prepend 1234
!
route-map DENY_ALL deny 10
