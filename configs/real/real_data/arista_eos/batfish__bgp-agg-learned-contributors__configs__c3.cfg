!RANCID-CONTENT-TYPE: arista
!
hostname c3
!
interface Ethernet1
 no switchport
 ip address 192.0.2.1 255.255.255.0
!
route-map ALLOW-ALL permit 10
!
router bgp 3
  router-id 192.0.2.2
  neighbor 192.0.2.3 remote-as 2
  neighbor 192.0.2.3 route-map ALLOW-ALL in
  neighbor 192.0.2.3 route-map ALLOW-ALL out
!
