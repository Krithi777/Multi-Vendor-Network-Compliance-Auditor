!RANCID-CONTENT-TYPE: arista
!
hostname c1
!
interface Ethernet1
 no switchport
 ip address 192.0.2.1 255.255.255.0
!
route-map ALLOW-ALL permit 10
!
ip route 192.0.2.2 255.255.255.224 Null0
ip route 192.0.2.3 255.255.255.255 Null0
!
router bgp 65001
  router-id 192.0.2.4
  redistribute static
  neighbor 192.0.2.5 remote-as 65166.10010
  neighbor 192.0.2.5 route-map ALLOW-ALL in
  neighbor 192.0.2.5 route-map ALLOW-ALL out
!
