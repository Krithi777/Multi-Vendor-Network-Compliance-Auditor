! Command: show running-config
! device: originator (vEOS, EOS-4.23.0.1F)
!
! boot system flash:/vEOS-lab.swi
!
hostname originator
!
interface Ethernet1
   no switchport
   ip address 192.0.2.1/24
!
interface Loopback1
   ip address 192.0.2.2/32
!
interface Loopback2
   ip address 192.0.2.3/32
!
ip routing
!
ip prefix-list CONNECTED_1 seq 10 permit 192.0.2.2/32
ip prefix-list CONNECTED_2 seq 10 permit 192.0.2.3/32
!
route-map CONNECTED permit 10
   match ip address prefix-list CONNECTED_1
!
route-map CONNECTED permit 20
   match ip address prefix-list CONNECTED_2
   set local-preference 5
!
router bgp 65000
   router-id 192.0.2.1
   neighbor 192.0.2.4 remote-as 65000
   neighbor 192.0.2.4 maximum-routes 12000
   redistribute connected route-map CONNECTED
!
