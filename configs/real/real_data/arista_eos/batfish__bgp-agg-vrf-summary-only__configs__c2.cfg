!RANCID-CONTENT-TYPE: arista
!
hostname c2
!
vrf instance vxlan_public
!
interface Ethernet1
 no switchport
 vrf vxlan_public
 ip address 192.0.2.1 255.255.255.0
!
interface Ethernet2
 no switchport
 vrf vxlan_public
 ip address 192.0.2.2 255.255.255.0
!
route-map ALLOW-ALL permit 10
!
router bgp 65166.10010
  router-id 192.0.2.3
  !
  vrf vxlan_public
    router-id 192.0.2.3
    aggregate-address 0.0.0.0/0 summary-only advertise-only
    neighbor 192.0.2.4 remote-as 65001
    neighbor 192.0.2.4 route-map ALLOW-ALL in
    neighbor 192.0.2.4 route-map ALLOW-ALL out
    neighbor 192.0.2.5 remote-as 65002
    neighbor 192.0.2.5 route-map ALLOW-ALL in
    neighbor 192.0.2.5 route-map ALLOW-ALL out
!
