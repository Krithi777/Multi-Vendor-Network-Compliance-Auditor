config system global
    set hostname "addrgrp_warnings"
end

config firewall address
    edit "addr1"
        set type iprange
        set start-ip 192.0.2.1
        set end-ip 192.0.2.2
    next
    edit "addr2"
        set type iprange
        set start-ip 192.0.2.3
        set end-ip 192.0.2.4
    next
    edit "addr3"
        set type iprange
        set start-ip 192.0.2.5
        set end-ip 192.0.2.6
    next
    edit "addr4"
        set type iprange
        set start-ip 192.0.2.7
        set end-ip 192.0.2.8
    next
    edit "addr5"
        set type iprange
        set start-ip 192.0.2.9
        set end-ip 192.0.2.10
    next
end
config firewall addrgrp
    edit "this is longer than the longest firewall addrgrp name that is accepted by device"
        set member addr3
    next
    edit "valid"
        set member addr1
    next
    edit "grp1"
        set comment "no member set"
    next
    edit "grp2"
        set member addr1
        set comment "no exclude-member set"
        set exclude enable
        # Can't exclude addrgrp, only address
        set exclude-member valid
    next
    edit "grp3"
        set member addr1
        set comment "exclude is not enabled"
        set exclude-member addr2
        append exclude-member addr3
    next
    edit "cycles"
        set comment "no cycles yet"
        set member valid
    next
    edit "valid"
        append member "cycles"
        append member "valid"
    next
    edit "folder"
        # No warning for changing type during initial declaration
        set type default
        set type folder
        set member addr5
    next
    edit folder
        # Type cannot be changed on an existing addrgrp
        set type default
    next
end
