config system global
    set hostname "bgp"
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 192.0.2.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 192.0.2.2 255.255.255.0
        set type physical
        set vrf 5
    next
end
config router access-list
   edit "acl1"
       config rule
           edit 1
               set prefix 192.0.2.3/24
           next
           edit 2
               set prefix 192.0.2.4/24
           next
       end
   next
end
config router route-map
    edit rm1
    next
    edit rm2
        config rule
            edit 1
                set action permit
                set match-ip-address "acl1"
            next
        end
    next
end
config router bgp
    # `set as 0` effectively clears the process AS
    set as 0
    set as 1
    set router-id 192.0.2.5
    config neighbor
        edit "192.0.2.6"
            set remote-as 1
            set route-map-in rm1
            set route-map-out rm2
            set update-source port1
        next
        edit "192.0.2.7"
            set remote-as 4294967295
        next
    end
    config network
        # `edit 0` should make CLI default to 1
        edit 0
            set prefix 192.0.2.8/24
        next
        edit 4294967295
            set prefix 192.0.2.9 255.255.255.0
        next
    end
end
