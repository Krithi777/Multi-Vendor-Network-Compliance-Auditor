config system global
    set hostname "access_list"
end
config router access-list
    edit "the_longest_access_list_name_possib"
    next
    edit "acl_name1"
        set comments "comment for acl_name1"
        config rule
            edit 12
                # Permits 192.0.2.1/24 (set in later edit block)
                set action permit
                set exact-match enable
                set wildcard 192.0.2.2 0.255.255.255
                set prefix 192.0.2.2/28
            next
            edit 1
                # Denies everything in 192.0.2.3/8
                set action deny
                set exact-match disable
                set prefix 192.0.2.2/24
                set wildcard 192.0.2.2 0.255.255.255
            next
            edit 2
                # Permits everything else
                set prefix any
            next
            edit 12
                set prefix 192.0.2.2/24
            next
        end
    next
end
