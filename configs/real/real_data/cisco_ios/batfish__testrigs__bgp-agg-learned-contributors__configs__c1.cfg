!RANCID-CONTENT-TYPE: cisco
!
hostname c1
!
interface GigabitEthernet0/0
 ip address 192.0.2.1 255.255.255.0
!
route-map ALLOW-ALL permit 10
!
ip route 192.0.2.2 255.255.255.0 Null0
ip route 192.0.2.3 255.255.255.0 Null0
!
router bgp 2
  bgp router-id 192.0.2.4
  redistribute static
  neighbor 192.0.2.5 remote-as 2
  neighbor 192.0.2.5 activate
  neighbor 192.0.2.5 route-map ALLOW-ALL in
  neighbor 192.0.2.5 route-map ALLOW-ALL out
!
