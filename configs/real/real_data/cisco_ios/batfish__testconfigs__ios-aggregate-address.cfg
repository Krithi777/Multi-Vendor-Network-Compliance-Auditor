!RANCID-CONTENT-TYPE: cisco
!
hostname ios-aggregate-address
!
route-map atm1 permit 100
 set metric 50
!
route-map adm permit 100
 match tag 5
!
route-map atm2 permit 100
 set community 1:1
!
route-map sm1 permit 100
 match tag 5
!
route-map sm2 permit 100
 match tag 5
!
router bgp 1
 bgp router-id 192.0.2.1
 ! no suppression, everything more specific contributes, no inheritance
 aggregate-address 192.0.2.2 255.255.0.0
 ! attribute-map should transform aggregate
 aggregate-address 192.0.2.3 255.255.0.0 attribute-map atm1
 ! inheritance
 aggregate-address 192.0.2.4 255.255.0.0 as-set
 ! inheritance and contributors are limited to routes passing advertise-map,
 aggregate-address 192.0.2.5 255.255.0.0 as-set advertise-map adm
 ! attribute-map applies after inheritance
 aggregate-address 192.0.2.6 255.255.0.0 as-set attribute-map atm2
 ! suppression everything more specific
 aggregate-address 192.0.2.7 255.255.0.0 summary-only
 ! suppress only routes passing suppress-map
 aggregate-address 192.0.2.8 255.255.0.0 suppress-map sm1
 ! suppress only routes passing suppress-map, completely ignoring summary-only
 aggregate-address 192.0.2.9 255.255.0.0 summary-only suppress-map sm2
 ! undefined route-maps
 aggregate-address 192.0.2.10 255.255.0.0 advertise-map undefined attribute-map undefined suppress-map undefined
!
