!RANCID-CONTENT-TYPE: cisco
version 15.2
!
hostname ios-vrf-leaking
!
vrf definition SRC_VRF
 rd 65003:1
 !
 address-family ipv4
  route-target export 65003:11
 exit-address-family
!
vrf definition SRC_VRF_WITH_EXPORT_MAP
 rd 65003:5
 !
 address-family ipv4
  route-target export 65003:11
  export map EXPORT_MAP
 exit-address-family
!
! export these two from SRC_VRF
ip route vrf SRC_VRF 192.0.2.1 255.255.255.255 Null0
ip route vrf SRC_VRF 192.0.2.2 255.255.255.0 Null0
! export only the first from SRC_VRF_WITH_EXPORT_MAP
ip route vrf SRC_VRF_WITH_EXPORT_MAP 192.0.2.3 255.255.255.0 Null0
! suppress the second from SRC_VRF_WITH_EXPORT_MAP by altering its route-target with export map
ip route vrf SRC_VRF_WITH_EXPORT_MAP 192.0.2.4 255.255.255.0 Null0
!
vrf definition DST_VRF
 rd 65003:2
 !
 address-family ipv4
  import map IMPORT_MAP
  route-target export 65003:22
  route-target import 65003:11
 exit-address-family
!
vrf definition DST_VRF_NO_IMPORT_MAP
 rd 65003:6
 !
 address-family ipv4
  route-target import 65003:11
 exit-address-family
!
vrf definition DST_IMPOSSIBLE
  rd 65003:3
  !
  address-family ipv4
   import map UNDEFINED
   route-target import 65003:11
  exit-address-family
!
vrf definition NOT_UNDER_ROUTER_BGP
  rd 65003:4
  address-family ipv4
   route-target import 65003:11
  exit-address-family
!
router bgp 65003
 bgp router-id 192.0.2.5
 !
 address-family ipv4 vrf SRC_VRF
  bgp router-id 192.0.2.6
  redistribute static
 exit-address-family
 !
 address-family ipv4 vrf SRC_VRF_WITH_EXPORT_MAP
  bgp router-id 192.0.2.6
  redistribute static
 exit-address-family
 !
 address-family ipv4 vrf DST_VRF
  bgp router-id 192.0.2.7
 exit-address-family
 !
 address-family ipv4 vrf DST_VRF_NO_IMPORT_MAP
  bgp router-id 192.0.2.7
 exit-address-family
 !
!
ip prefix-list import_pl seq 2 permit 192.0.2.2/24
ip prefix-list import_pl seq 3 permit 192.0.2.3/24
ip prefix-list import_pl seq 4 permit 192.0.2.4/24
!
ip prefix-list export_pl seq 4 permit 192.0.2.4/24
!
route-map IMPORT_MAP permit 10
 match ip address prefix-list import_pl
route-map EXPORT_MAP permit 10
 match ip address prefix-list export_pl
 ! this route-target will be rejected by DST_VRF
 set extcommunity rt 65003:1234