!
hostname ios-prefix-list
!
router bgp 64904
 router-id 192.0.2.1
 neighbor 192.0.2.2 remote-as 1234
 neighbor 192.0.2.2 prefix-list pre_list in
 neighbor 192.0.2.2 prefix-list pre_list out
!
! For testing undefined prefix-list in BGP neighbor context
 neighbor 192.0.2.3 prefix-list pre_list_undef1 out
!
route-map STATIC_ONLY permit 10
  match ip address prefix-list pre_list
  match ip address prefix-list pre_list_undef2
!
ip prefix-list pre_list seq 5 permit 192.0.2.4/24
ip prefix-list pre_list_unused seq 10 permit 192.0.2.5/24
