!RANCID-CONTENT-TYPE: cisco
!
hostname c2
!
interface GigabitEthernet0/0
 ip address 192.0.2.1 255.255.255.0
!
interface GigabitEthernet0/1
 ip address 192.0.2.2 255.255.255.0
!
route-map ALLOW-ALL permit 10
!
router bgp 2
  bgp router-id 192.0.2.3
  aggregate-address 192.0.2.4 255.255.0.0
  aggregate-address 192.0.2.5 255.255.0.0 summary-only
  neighbor 192.0.2.6 remote-as 2
  neighbor 192.0.2.6 route-map ALLOW-ALL in
  neighbor 192.0.2.6 route-map ALLOW-ALL out
  neighbor 192.0.2.7 remote-as 3
  neighbor 192.0.2.7 route-map ALLOW-ALL in
  neighbor 192.0.2.7 route-map ALLOW-ALL out
!
