!
hostname ios-nat-mixed
!
!
access-list 10 permit host 192.0.2.1
!
interface Ethernet1
 ip nat inside
!
interface Ethernet2
 ip nat outside
!
!
ip nat pool in-src-nat-pool 192.0.2.2 192.0.2.3 prefix-length 24
!
ip nat inside source static network 192.0.2.4 192.0.2.5 255.255.255.0
!
ip nat inside source list 10 pool in-src-nat-pool
