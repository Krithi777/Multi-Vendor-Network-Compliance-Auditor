!
hostname ios-acl-in-routemap
!
!
access-list 10 permit 192.0.2.1 0.255.255.255
ipv6 access-list standard v6list permit ::FFFF:192.0.2.1/104
!
route-map RM permit 100
  match ip address 10
!
route-map RM6 permit 110
  match ipv6 address v6list
!
interface Ethernet1
 ip address 192.0.2.2 255.255.255.0
 ip access-group 10 in
!
router bgp 1
 neighbor 192.0.2.3 remote-as 2
 neighbor 192.0.2.3 route-map RM out
 network 192.0.2.4/24
 neighbor ::FFFF:192.0.2.3 remote-as 2
 neighbor ::FFFF:192.0.2.3 route-map RM6 out
