!
hostname ios-eigrp-distribute-list-prefix-list
!
ip prefix-list PL_IN permit 192.0.2.1/24 ge 24
ip prefix-list PL_IN_IFACE permit 192.0.2.1/24 ge 30
ip prefix-list PL_OUT permit 192.0.2.2/24 ge 24
ip prefix-list PL_OUT_IFACE permit 192.0.2.2/24 ge 30
!
interface GigabitEthernet0/0
 ip address 192.0.2.3 255.255.255.0
interface GigabitEthernet1/0
 ip address 192.0.2.4 255.255.255.0
!
router eigrp 1
  distribute-list prefix PL_IN in
  distribute-list prefix PL_OUT out
  distribute-list prefix PL_IN_IFACE in GigabitEthernet0/0
  distribute-list prefix PL_OUT_IFACE out GigabitEthernet0/0
  network 192.0.2.2 0.0.0.255
  network 192.0.2.5 0.0.0.255
!