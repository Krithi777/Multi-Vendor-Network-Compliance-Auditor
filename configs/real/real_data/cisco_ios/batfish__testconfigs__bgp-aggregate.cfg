!RANCID-CONTENT-TYPE: cisco
!
hostname bgp-aggregate
!
ip route 192.0.2.1 255.255.255.0 Null0
ip route 192.0.2.2 255.255.255.0 Null0
! less specific than similar aggregate
ip route 192.0.2.3 255.0.0.0 Null0
! less specific than one similar aggregate, but more specific than another
ip route 192.0.2.4 255.255.255.0 Null0
! same length as similar aggregate
ip route 192.0.2.5 255.255.0.0 Null0
!
router bgp 1
  bgp router-id 192.0.2.6
  aggregate-address 192.0.2.7 255.255.0.0
  aggregate-address 192.0.2.8 255.255.0.0 summary-only
  aggregate-address 192.0.2.3 255.255.0.0 summary-only
  aggregate-address 192.0.2.9 255.255.0.0 summary-only
  aggregate-address 192.0.2.4 255.255.255.254 summary-only
  aggregate-address 192.0.2.5 255.255.0.0 summary-only
  redistribute static
!
