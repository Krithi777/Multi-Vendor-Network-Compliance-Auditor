!
hostname exporter
!
interface Ethernet1
  ip address 192.0.2.1 255.255.255.248
  no shutdown
  speed auto
!
interface Loopback0
  ip address 192.0.2.2 255.255.255.255
!
! This routemap should permit everything
route-map TEST_EXPORT_PERMIT permit 10
!
! Whereas this routemap should deny everything
route-map TEST_EXPORT_DENY deny 10
!
router bgp 1
  router-id 192.0.2.2
  neighbor 192.0.2.3 remote-as 2
  neighbor 192.0.2.3 route-map TEST_EXPORT_PERMIT out
  neighbor 192.0.2.4 remote-as 3
  neighbor 192.0.2.4 route-map TEST_EXPORT_DENY out
  network 192.0.2.2/32
