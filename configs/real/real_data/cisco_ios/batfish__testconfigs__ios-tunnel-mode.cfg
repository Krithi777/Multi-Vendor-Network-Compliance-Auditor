!
 hostname ios-tunnel-mode
 !
 interface TenGigabitEthernet0/0
  ip address 192.0.2.1 255.255.255.0
 !
 interface Tunnel1
  ip address 192.0.2.2 255.255.255.0
  tunnel source TenGigabitEthernet0/0
  tunnel destination 192.0.2.3
 !
 interface Tunnel2
  ip address 192.0.2.4 255.255.255.0
  tunnel source TenGigabitEthernet0/0
  tunnel destination 192.0.2.5
  tunnel mode gre multipoint
 !
 interface Tunnel3
  ip address 192.0.2.6 255.255.255.0
  tunnel source TenGigabitEthernet0/0
  tunnel destination 192.0.2.7
  tunnel mode ipsec ipv4
 !