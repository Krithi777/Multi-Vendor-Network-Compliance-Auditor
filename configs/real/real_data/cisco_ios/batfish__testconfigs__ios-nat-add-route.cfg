!
hostname ios-nat-add-route
!
ip vrf vrf1
!
interface Ethernet1
 ip nat inside
!
interface Ethernet2
 ip address 192.0.2.1 255.255.255.0
 ip nat outside
!
interface Ethernet3
 ip vrf forwarding vrf1
 ip nat inside
!
interface Ethernet4
 ip address 192.0.2.2 255.255.255.0
 ip vrf forwarding vrf1
 ip nat outside
!
ip nat outside source static 192.0.2.3 192.0.2.4 add-route
ip nat outside source static 192.0.2.5 192.0.2.6 add-route
ip nat outside source static 192.0.2.7 192.0.2.8 vrf vrf1 add-route
