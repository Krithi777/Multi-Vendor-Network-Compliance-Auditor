!
hostname ios_svi
!
vlan 100,3000
!
interface Vlan100
 ip address 192.0.2.1 255.255.255.0
 no shutdown
!
interface Vlan3000
 ip address 192.0.2.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0
 switchport mode access
 switchport access vlan 100
 shutdown
!
interface GigabitEthernet0/1
 switchport mode access
 switchport access vlan 3000
 shutdown
!

