!
hostname ios-nat-dynamic-route-maps
!
!
access-list 10 permit host 192.0.2.1
access-list 11 permit host 192.0.2.2
access-list 12 permit host 192.0.2.3
access-list 13 permit host 192.0.2.4
access-list 22 permit host 192.0.2.5
access-list 23 permit host 192.0.2.6
!
route-map 10 permit 10
 match ip address 10
route-map 12 permit 10
 match ip address 12
route-map 13 permit 10
 match ip address 13
route-map 22 permit 10
 match ip address 22
 match interface Ethernet2/0
route-map 23 permit 10
 match ip address 23
!
ip vrf vrf1
!
interface Ethernet1
 ip nat inside
!
interface Ethernet2/0
 ip nat outside
!
interface Ethernet2/1
 ip nat outside
!
interface Ethernet3
 ip vrf forwarding vrf1
 ip nat inside
!
interface Ethernet4
 ip vrf forwarding vrf1
 ip nat outside
!
! For use in "ip nat inside source route-map 13 interface" rule
interface Ethernet10
 ip address 192.0.2.7 255.255.255.0

ip nat pool in-src-nat-pool 192.0.2.8 192.0.2.9 prefix-length 24
ip nat pool in-dst-nat-pool 192.0.2.10 192.0.2.11 prefix-length 24
ip nat pool out-src-nat-pool 192.0.2.12 192.0.2.13 prefix-length 24
ip nat pool vrf-in-src-nat-pool 192.0.2.14 192.0.2.15 prefix-length 24
ip nat pool vrf-out-src-nat-pool 192.0.2.16 192.0.2.17 prefix-length 24

ip nat inside source route-map 10 pool in-src-nat-pool overload
ip nat inside source route-map 13 interface Ethernet10
ip nat inside destination list 11 pool in-dst-nat-pool
ip nat outside source route-map 22 pool out-src-nat-pool

ip nat inside source route-map 12 pool vrf-in-src-nat-pool vrf vrf1
ip nat outside source route-map 23 pool vrf-out-src-nat-pool vrf vrf1
