!
hostname ios-ospf-stub-settings
!
interface Ethernet0
 ip address 192.0.2.1 255.255.255.0
 no shutdown
!
interface Ethernet1
 ip address 192.0.2.2 255.255.255.0
 no shutdown
!
interface Ethernet2
 ip address 192.0.2.3 255.255.255.0
 no shutdown
!
interface Ethernet3
 ip address 192.0.2.4 255.255.255.0
 no shutdown
!
interface Ethernet4
 ip address 192.0.2.5 255.255.255.0
 no shutdown
!
interface Ethernet5
 ip address 192.0.2.6 255.255.255.0
 no shutdown
!
router ospf 1
 network 192.0.2.7 0.0.0.255 area 0
 network 192.0.2.8 0.0.0.255 area 1
 network 192.0.2.9 0.0.0.255 area 2
 network 192.0.2.10 0.0.0.255 area 3
 network 192.0.2.11 0.0.0.255 area 4
 network 192.0.2.12 0.0.0.255 area 5
 area 1 nssa
 area 1 nssa default-information-originate
 area 2 nssa no-summary
 area 3 stub
 area 4 stub no-summary
!
!
