!
hostname ios-nat-static
!
access-list 10 permit host 192.0.2.1
!
route-map 10 permit 10
 match ip address 10
!
ip vrf vrf1
!
interface Ethernet1
 ip nat inside
!
interface Ethernet2
 ip nat outside
!
interface Ethernet3
 ip vrf forwarding vrf1
 ip nat inside
!
interface Ethernet4
 ip vrf forwarding vrf1
 ip nat outside
!


ip nat inside source static 192.0.2.2 192.0.2.3 route-map 10
ip nat inside source static network 192.0.2.4 192.0.2.5 /14
ip nat inside source static network 192.0.2.6 192.0.2.7 255.255.255.0

ip nat outside source static 192.0.2.8 192.0.2.9

ip nat inside source static 192.0.2.10 192.0.2.11 vrf vrf1
ip nat outside source static 192.0.2.12 192.0.2.13 vrf vrf1