!
!
hostname n1-static-route
!
interface TenGigabitEthernet0/0
  no shutdown
  ip address 192.0.2.1 255.255.255.0
!
interface TenGigabitEthernet0/1
  no shutdown
  description link to n2
  ip address 192.0.2.2 255.255.255.254
!
interface Tunnel1
  no shutdown
  ip address 192.0.2.3 255.255.255.0
  tunnel source TenGigabitEthernet0/0
  tunnel destination 192.0.2.4
  tunnel mode gre multipoint
!
ip route 192.0.2.4 255.255.255.255 TenGigabitEthernet0/1
