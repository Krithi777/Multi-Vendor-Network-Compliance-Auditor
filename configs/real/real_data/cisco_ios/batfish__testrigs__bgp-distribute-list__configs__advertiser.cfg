hostname advertiser
!
! To r1
interface FastEthernet0/0
 ip address 192.0.2.1 255.255.255.0
!
! To r2
interface FastEthernet0/1
 ip address 192.0.2.2 255.255.255.0
!
interface Loopback0
 ip address 192.0.2.3 255.255.255.255
!
router bgp 10
 bgp router-id 192.0.2.3
 redistribute static
 ! Filter routes to r1 with standard access list 1
 neighbor 192.0.2.4 remote-as 1
 neighbor 192.0.2.4 distribute-list 1 out
 ! Filter routes to r2 with extended access list 100
 neighbor 192.0.2.5 remote-as 2
 neighbor 192.0.2.5 distribute-list 100 out
!
! Standard access list 1
access-list 1 deny 192.0.2.6
access-list 1 permit any
!
! Extended access list 100
access-list 100 permit ip host 192.0.2.7 host 255.255.255.255
access-list 100 deny ip any any
!
ip route 192.0.2.6 255.255.255.255 Null0
ip route 192.0.2.7 255.255.255.255 Null0
