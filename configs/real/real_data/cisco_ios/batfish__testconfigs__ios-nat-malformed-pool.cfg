hostname ios-nat-malformed-pool

interface Ethernet1
  ip nat outside
  ip address 192.0.2.1 255.255.255.248

ip access-list standard LIST
 permit 192.0.2.2 0.0.0.255
! Note the pool is not a valid range
ip nat pool SNOOKER 192.0.2.3 192.0.2.4 netmask 255.255.255.0
ip nat outside source list LIST pool SNOOKER

! Note the pool first/last IPs are the network Ip (results in an empty pool)
ip nat pool SNOOKER2 192.0.2.5 192.0.2.5 netmask 255.255.255.0