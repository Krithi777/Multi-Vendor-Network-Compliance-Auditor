!
hostname ios-ospf-process-inference
!
interface Ethernet1
 ip address 192.0.2.1 255.255.255.0
 no shutdown
!
interface Ethernet2
 ip address 192.0.2.2 255.255.255.128
 no shutdown
!
interface Ethernet3
 ip address 192.0.2.3 255.255.255.128
 no shutdown
!
interface Ethernet4
 ip address 192.0.2.4 255.255.255.0
 no shutdown
!
router ospf 1
 router-id 192.0.2.5
 network 192.0.2.6 0.0.0.255 area 1
!
router ospf 2
 router-id 192.0.2.5
 network 192.0.2.7 0.0.0.255 area 2
!
router ospf 3
!
