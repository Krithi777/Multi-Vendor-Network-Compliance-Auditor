!
hostname ios-abr
!
!
interface Loopback1
 ip address 192.0.2.1 255.255.255.255
!
! To area 0
interface Ethernet0
 ip address 192.0.2.2 255.255.255.0
!
! To area 1
interface Ethernet1
 ip address 192.0.2.3 255.255.255.0
!
router ospf 1
 network 192.0.2.4 0.0.255.255 area 0
 network 192.0.2.5 0.0.255.255 area 1
 area 1 nssa
 redistribute connected subnets
!
