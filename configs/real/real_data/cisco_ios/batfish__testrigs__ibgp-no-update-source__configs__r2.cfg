hostname r2
!
interface Loopback0
   ip address 192.0.2.1/32
!
interface Ethernet1
   ip address 192.0.2.2/24
!
!
router bgp 1
   router-id 192.0.2.1
   redistribute static
   neighbor 192.0.2.3 remote-as 1
   neighbor 192.0.2.3 update-source Loopback0
!
ip route 192.0.2.3/32 192.0.2.4
ip route 192.0.2.5/32 Null0
!
end
