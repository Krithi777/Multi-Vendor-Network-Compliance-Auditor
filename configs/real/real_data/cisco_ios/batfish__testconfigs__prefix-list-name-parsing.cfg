!
version 15.1
hostname prefix-list-name-parsing
router bgp 65000
 !
 neighbor 192.0.2.1 remote-as 65535
 neighbor 192.0.2.1 description eBGP peer
 neighbor 192.0.2.1 version 4
 !
 address-family ipv4
  neighbor 192.0.2.1 route-map SET_LOCALPREF200_eBGP in
 exit-address-family
!
ip bgp-community new-format
!
ip prefix-list SET_COMMUNITY_65535:200 seq 10 permit 192.0.2.2/8
!
ip prefix-list DEFINED_BUT_NOT_USED seq 10 permit 192.0.2.2/8
!
!
route-map SET_LOCALPREF200_eBGP permit 10
 match ip address prefix-list SET_COMMUNITY_65535:200
 set local-preference 200
 match ip address prefix-list USED_BUT_NOT_DEFINED
 set local-preference 50
!
end
