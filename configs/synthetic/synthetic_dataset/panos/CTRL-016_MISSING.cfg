set deviceconfig system hostname baseline-panos
set deviceconfig system service disable-http yes
set deviceconfig system service disable-https no
set deviceconfig system idle-timeout 10
set mgt-config users admin authentication-profile aaa-profile
set shared password-complexity minimum-length 8
set shared password-complexity failed-attempts 3
set shared log-settings config
set shared syslog syslog-profile1 server-list srv1 server 10.0.0.5
set deviceconfig system ntp-servers primary-ntp-server ntp-server-address 10.0.0.10
set deviceconfig system ntp-servers primary-ntp-server authentication-type symmetric-key
set deviceconfig system snmp-setting access-setting version v3
set deviceconfig system permitted-ip 10.0.0.0/24
set deviceconfig system permitted-ip 10.0.0.0/24
set deviceconfig system login-banner "Authorized access only"
set deviceconfig system ciphers ssh-mac hmac-sha2-256
set deviceconfig system service disable-telnet yes
