set system host-name baseline-juniper
set system services ssh protocol-version v2
set system services web-management https
set system login idle-timeout 10
set system authentication-order [radius password]
set system login password minimum-length 8
set system login retry-options tries-before-disconnect 3
set system syslog file messages any any
set system syslog host 10.0.0.5 any any
set system ntp server 10.0.0.10
set system ntp server 10.0.0.10 key 1
set snmp v3 usm local-engine user snmpv3user
set interfaces lo0 unit 0 family inet filter input mgmt-acl
set protocols ospf area 0 interface ge-0/0/0 authentication-type md5
set firewall family inet filter mgmt-in term allow-mgmt from source-address 10.0.0.0/24
set system login message "Authorized access only"
set system services ssh macs hmac-sha2-256
